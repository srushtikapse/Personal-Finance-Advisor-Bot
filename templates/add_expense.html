{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 40px auto;">
    <h2 style="margin-top: 0; color: #2c3e50;">Add Expense Record</h2>
    
    <form method="POST">
        <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input type="number" step="0.01" id="amount" name="amount" placeholder="0.00" required>
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="" disabled selected>Select category...</option>
                <option value="Rent/Housing">Rent / Housing</option>
                <option value="Food & Groceries">Food & Groceries</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Education">Education</option>
                <option value="Utilities">Utilities</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Description (Optional)</label>
            <input type="text" id="description" name="description" placeholder="e.g. Weekly grocery shopping">
        </div>

        <div style="margin-top: 25px; display: flex; gap: 10px;">
            <button type="submit" class="btn" style="flex: 1;">Save Expense</button>
            <a href="{{ url_for('dashboard') }}" class="btn" style="background: #7f8c8d; text-align: center; text-decoration: none; flex: 1;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
