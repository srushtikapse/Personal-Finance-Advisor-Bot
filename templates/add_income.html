{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 30px auto;">
    <h2>Add Income Record</h2>
    <form method="POST">
        <div class="form-group">
            <label>Income Source (e.g., Salary, Freelance)</label>
            <input type="text" name="source" required>
        </div>
        <div class="form-group">
            <label>Amount ($)</label>
            <input type="number" step="0.01" name="amount" required>
        </div>
        <button type="submit" class="btn">Save Income</button>
    </form>
</div>
{% endblock %}
